<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSR Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" id="bg"></div>

  <header class="top">
    <img src="logo.svg" alt="Makerspace Ringebu" class="logo" id="logo" draggable="false">
    <div class="top-right">
      <div class="hours" id="hours"></div>
      <div class="clock">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date"></div>
      </div>
    </div>
  </header>

  <main>
    <h1 id="subtitle">Hva vil du lage i dag?</h1>
    <div class="messages" id="messages"></div>
    <div id="sections"></div>
  </main>

  <footer class="bottom">
    <button class="ghost" id="btn-desktop" type="button">
      <span aria-hidden="true">🖥️</span> Vis skrivebord
    </button>
    <div class="meta" id="meta"></div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Admin: hold inne logoen i 3 sekunder -->
  <div class="modal" id="admin" hidden>
    <div class="card">
      <h2>Vedlikehold</h2>
      <p class="muted">Skriv inn PIN-koden.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
      <p class="err" id="pin-err" hidden>Feil PIN</p>
      <div class="row">
        <button class="ghost" id="adm-cancel" type="button">Avbryt</button>
        <button class="ghost" id="adm-reload" type="button">Hent oppsett på nytt</button>
        <button class="danger" id="adm-quit" type="button">Avslutt launcher</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
